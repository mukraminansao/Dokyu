packages:
  - apps/*
  - packages/*
  - server

# pnpm 10 skips dependency build scripts unless they are listed here.
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - prisma

# Security: newer patched versions of indirect dependencies (pnpm audit).
overrides:
  deepmerge-ts: ^8.0.2
  "@expo/fingerprint>minimatch": ^11.0.1
